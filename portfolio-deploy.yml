---
name: Portfolio
on:
  push:
    branches:
      - main
permissions:
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: test_environment
      url: ${{ steps.step_name.outputs.url_output }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup github pages
        uses: actions/configure-pages@v4
      - name: uplad static files
        uses: actions/upload-pages-artifact2v4
      - name: delpoy to github pages
        uses: action/deploy-pages@v4

      
              
